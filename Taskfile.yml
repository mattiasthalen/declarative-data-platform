version: "3"

tasks:
  generate:
    desc: Regenerate the dbt models of every layer from the declarations, and the README's artwork
    cmds:
      - uv run conform generate
      - uv run integrate generate
      - uv run serve generate
      - uv run artwork generate

  check:
    desc: Fail if any layer's committed models or README diagram, or the README's artwork, differ from what generates them
    silent: true
    cmds:
      - |
        failed=0
        for layer in conform integrate serve artwork; do
          if uv run "$layer" generate --check; then
            echo "$layer: pass"
          else
            echo "$layer: fail"
            failed=1
          fi
        done
        exit $failed

  ingest:
    desc: Land every declared resource in the lake, one dlt pipeline each
    cmds:
      - uv run ingest

  ingest:list:
    desc: Print each declared source's name, one per line
    cmds:
      - uv run ingest --list

  ingest:source:
    desc: Land one source's resources (task -x ingest:source -- SOURCE); with -x, exits 0 all landed, 1 some, 2 none
    # The precondition reads the name as a variable: go-task's quoting of CLI_ARGS does not
    # survive inside double quotes, where `$(...)` in a name would run. go-task also renders
    # CLI_ARGS as a template, so a name holding `{{...}}` can still escape the cmd's quoting.
    # Scheduled names come from `ingest --list`, which admits only snake_case; whoever can set a
    # name by hand can set the command too (ADR-0024). `--` keeps a name starting with `-` from
    # being read as one of ingest's options.
    env:
      SOURCE_ARGS: "{{.CLI_ARGS}}"
    preconditions:
      - sh: test -n "$SOURCE_ARGS"
        msg: "name the source: task ingest:source -- SOURCE"
    cmds:
      - uv run ingest -- {{.CLI_ARGS}}

  simulate:
    desc: Append one seeded, changed copy of the latest Products and ProductSubcategories loads to the lake
    cmds:
      - uv run simulate {{.CLI_ARGS}}

  build:
    desc: Build every layer into the target's DuckDB file (TARGET=dev by default)
    cmds:
      - uv run dbt build --target {{.TARGET | default "dev"}}

  test-rules:
    desc: Prove each layer's agent rules load, in real Claude Code sessions (local only)
    cmds:
      - uv run pytest -m claude -n 0

  orchestrate:server:
    desc: Start a local Prefect server, standing in for the infra's (http://127.0.0.1:4200)
    cmds:
      - uv run prefect server start

  orchestrate:worker:
    desc: Start a process worker on the work pool $ORCHESTRATE_WORK_POOL names, from the repo root
    preconditions: &pool
      - sh: test -n "$ORCHESTRATE_WORK_POOL"
        msg: "name the work pool: export ORCHESTRATE_WORK_POOL=<pool>"
    cmds:
      - uv run prefect worker start --pool "$ORCHESTRATE_WORK_POOL" --type process

  film:
    desc: Render the README's explainer into out/film/ (narrated, captioned; needs ffmpeg and task film:models)
    cmds:
      - uv run film render

  film:models:
    desc: Fetch the Kokoro voice files into .models/, verified by their pinned checksums (about 350 MB)
    cmds:
      - uv run film models

  orchestrate:deploy:
    desc: Deploy orchestrate/prefect.yaml (the hourly run, ingest-source, build) to $PREFECT_API_URL
    preconditions: *pool
    cmds:
      - uv run prefect --no-prompt deploy --all --prefect-file orchestrate/prefect.yaml
