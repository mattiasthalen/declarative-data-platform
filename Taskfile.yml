version: "3"

tasks:
  generate:
    desc: Regenerate the dbt models of every layer from the declarations
    cmds:
      - uv run conform generate
      - uv run integrate generate
      - uv run serve generate

  check:
    desc: Fail if any layer's committed models differ from what its declarations produce
    silent: true
    cmds:
      - |
        failed=0
        for layer in conform integrate serve; do
          if uv run "$layer" generate --check; then
            echo "$layer: pass"
          else
            echo "$layer: fail"
            failed=1
          fi
        done
        exit $failed

  ingest:
    desc: Land every declared resource in the lake, one dlt pipeline each
    cmds:
      - uv run ingest

  ingest:list:
    desc: Print each declared source's name, one per line
    cmds:
      - uv run ingest --list

  ingest:source:
    desc: Land one source's resources (task ingest:source -- SOURCE); exits 0 all landed, 1 some, 2 none
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "name the source: task ingest:source -- SOURCE"
    cmds:
      - uv run ingest {{.CLI_ARGS}}

  build:
    desc: Build every layer into the target's DuckDB file (TARGET=dev by default)
    cmds:
      - uv run dbt build --target {{.TARGET | default "dev"}}

  test-rules:
    desc: Prove each layer's agent rules load, in real Claude Code sessions (local only)
    cmds:
      - uv run pytest -m claude
