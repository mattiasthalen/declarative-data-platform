# Guards the generated code (ADR-0013) and the platform's tests; both jobs are required on main (ADR-0014).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A pull request's newer push replaces its older run; each commit pushed to main has a group
  # of its own, so none of their runs is cancelled or replaced.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail on a uv.lock that no longer matches pyproject.toml instead of re-locking in CI.
  UV_LOCKED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.13.6"
          download-from-astral-mirror: false
          python-version: "3.13"
          enable-cache: true
      - run: uv run task check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.13.6"
          download-from-astral-mirror: false
          python-version: "3.13"
          enable-cache: true
      - run: uv run pytest
