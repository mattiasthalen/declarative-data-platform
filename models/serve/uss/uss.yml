version: 2
models:
- name: product_subcategory
  description: A subcategory products are grouped in, such as Mountain Bikes.
  columns:
  - name: _key__product_subcategory
    description: The identity and the version's valid-from, as identity|valid_from.
    data_tests:
    - not_null
    - unique
    - ghost_rows
  - name: product_subcategory__source_id
    description: The subcategory's id in the source, which products name it by; its natural key (ADR-0037).
  - name: product_subcategory__name
    description: The subcategory's name.
- name: _bridge
  description: 'The Puppini bridge: the union by name of every staged bridge.'
  columns:
  - name: _key__product
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('product')
          field: _key__product
  - name: _key__product_subcategory
    data_tests:
    - not_null:
        config: &id001
          severity: warn
    - relationships:
        arguments:
          to: ref('product_subcategory')
          field: _key__product_subcategory
        config: *id001
