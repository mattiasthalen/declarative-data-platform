# The Anchor model: one file, a mirror of anchor.xsd (ADR-0004). Keys are the XSD's
# elements and attributes; `uv run integrate generate` writes models/integrate/ from it.
schema:
  description: The business information model of the declarative data platform.
  anchor:
    - mnemonic: PR
      descriptor: Product
      identity: int
      description: A product the business makes or buys, and may sell.
      identifier:
        - route: NUM
      attribute:
        - mnemonic: NUM
          descriptor: ProductNumber
          dataRange: varchar(25)
          timeRange: timestamp
          description: The number that names one product across the business; its natural key.
          key:
            - stop: "1"
              route: NUM
              of: PR
        - mnemonic: NAM
          descriptor: Name
          dataRange: varchar(50)
          timeRange: timestamp
          description: The product's name.
        - mnemonic: LIN
          descriptor: ProductLine
          dataRange: varchar(2)
          timeRange: timestamp
          description: The product line, R road, M mountain, T touring or S standard; empty when the source has none.
        - mnemonic: COL
          descriptor: Color
          dataRange: varchar(15)
          timeRange: timestamp
          description: The product's colour.
        - mnemonic: SST
          descriptor: SellStart
          dataRange: date
          timeRange: timestamp
          description: The first day the product is on sale.
        - mnemonic: SEN
          descriptor: SellEnd
          dataRange: date
          timeRange: timestamp
          description: The last day the product is on sale.
        - mnemonic: DIS
          descriptor: Discontinued
          dataRange: date
          timeRange: timestamp
          description: The day the product was discontinued; it is no longer on sale from that day.
