# Business question (Daana's anatomy, approved 2026-10-31), answered by a later story:
#   "What is the total quantity of units sold per calendar month and product line?"
#   Aggregation: sum. Measure: Quantity.
#   Dimensions: calendar month, product line.
#   Time: every month the source holds (2013-07 to 2014-08 when measured).
#   Definitions:
#     sold: a transaction of type S, a sales order line. Work orders (W) and purchases (P) are not sales.
#     calendar month: the month of TransactionDate, the business date, not ModifiedDate or when it was extracted.
#     product line: the product's line as of the transaction date, the trimmed code, empty as its own group.
#
# Fetched incrementally from the last ModifiedDate seen, inclusive (ADR-0016).
endpoint:
  path: TransactionHistories
  params:
    $filter: "ModifiedDate ge {incremental.start_value}"
  incremental:
    cursor_path: ModifiedDate
    initial_value: "1900-01-01"
