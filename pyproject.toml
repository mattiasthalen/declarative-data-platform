[project]
name = "declarative-data-platform"
version = "0.1.0"
description = "Declarations in, structure out: a lake through Anchor to a Unified Star Schema today."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6"]

[project.scripts]
ingest = "ingest:main"
conform = "conform:main"
integrate = "integrate:main"
serve = "serve:main"
simulate = "simulate:main"

[dependency-groups]
ingest = ["dlt[parquet]>=1.32,<1.33"]
dbt = ["dbt-core>=1.12,<1.13", "dbt-duckdb>=1.11,<1.12"]
orchestrate = ["prefect>=3.9,<3.10"]
dev = ["pytest>=8", "duckdb", "go-task-bin>=3.54", "fonttools>=4.50", "brotli>=1.1"]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest", "src/conform", "src/integrate", "src/serve", "src/ownership", "src/simulate", "src/erd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "claude: runs real Claude Code sessions; only with `-m claude` (`task test-rules`), never in CI",
]
