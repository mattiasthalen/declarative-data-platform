[project]
name = "declarative-data-platform"
version = "0.1.0"
description = "Declarations in, a lake through Anchor to a Unified Star Schema out."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6"]

[project.scripts]
ingest = "ingest:main"
conform = "conform:main"
integrate = "integrate:main"
serve = "serve:main"

[dependency-groups]
ingest = ["dlt[parquet]>=1.32,<1.33"]
dbt = ["dbt-core>=1.12,<1.13", "dbt-duckdb>=1.11,<1.12"]
dev = ["pytest>=8", "duckdb", "go-task-bin>=3.54"]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest", "src/conform", "src/integrate", "src/serve", "src/ownership"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-p no:cacheprovider"
